apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-editor-configurations
  namespace: {{ Release.Namespace }}
data:
  extensions.json: |
{{ toJson (dict "recommendations" .Values.vscodeConfig.extensions) | indent 4 }}
  settings.json: |
{{ toJson .Values.vscodeConfig.settings | indent 4 }}
immutable: false